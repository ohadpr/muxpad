name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.check }}
    # Per-check, defaulting to ubuntu. The broker's suite is the exception and
    # the reason this is a variable: see its entry below.
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      # Report every check even if, for example, lint fails first.
      fail-fast: false
      matrix:
        include:
          - check: broker tests
            # macOS, BY CONSTRUCTION, not by preference. The broker is a macOS
            # daemon — launchd, dscl, /Library/LaunchDaemons — and
            # `assertProtectedPath` walks every ancestor of a path demanding
            # the right owner and no group/other write bit. A per-user temp dir
            # on macOS (/var/folders/…, 0700) satisfies that; Linux's /tmp is
            # mode 1777 and never can, so nine tests failed on ubuntu with
            # "Unprotected file or ancestor" — the check working correctly on a
            # filesystem its subject does not run on.
            os: macos-latest
            command: npm ci --ignore-scripts --prefix broker && npm test --prefix broker
          - check: typecheck
            command: pnpm typecheck
          - check: lint
            command: pnpm lint
          - check: shared tests
            command: pnpm --dir shared exec vitest run
          - check: web tests (jsdom)
            command: pnpm --dir web exec vitest run
          # SHARDED, and serial WITHIN a shard. Parallel file execution
          # intermittently times out ~9 integration tests under load and they
          # pass serially, so `--no-file-parallelism` stays — but the whole
          # suite run serially is ~14 min on a fast laptop and overran the
          # 20-minute job ceiling on a CI runner, which GitHub reports as
          # "cancelled" rather than a timeout and so read as a flake for days.
          # Sharding cuts the wall clock without touching the execution model;
          # do not fix this by raising the ceiling instead.
          #
          # SHARDS 2 AND 4 WERE RED FROM THE DAY THIS LANDED, and the cause was
          # not the clock: one test file in each hung forever on a recursive
          # mkdir under /proc, which is instant on macOS and infinite on the
          # Linux runner. Fixed at the source — see the note on `unwritable()`
          # in server/src/browser/BrowserShots.test.ts. If a shard ever again
          # burns its full 20 minutes and names no failing test, suspect a hang
          # during collection and bisect the shard file by file with
          # `timeout 60` per file; the job log's last completed file is the one
          # BEFORE the culprit.
          - check: server tests 1/4
            command: pnpm --dir server exec vitest run --no-file-parallelism --shard=1/4
          - check: server tests 2/4
            command: pnpm --dir server exec vitest run --no-file-parallelism --shard=2/4
          - check: server tests 3/4
            command: pnpm --dir server exec vitest run --no-file-parallelism --shard=3/4
          - check: server tests 4/4
            command: pnpm --dir server exec vitest run --no-file-parallelism --shard=4/4
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # Reads the pinned packageManager version from package.json.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared exports for web tests
        if: matrix.check == 'web tests (jsdom)'
        run: pnpm --dir shared exec tsc -b --force
      - name: Run ${{ matrix.check }}
        # Vitest strips types: the separate tsc -b check is mandatory.
        run: ${{ matrix.command }}
        env:
          NODE_OPTIONS: --no-experimental-webstorage
          # This workflow does not install browsers or build web/dist. Existing
          # browser integration tests report skips. See ../README.md for gaps;
          # a green run is NOT a browser/scrolling or mobile-keyboard guarantee.
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/muxpad-no-browsers
