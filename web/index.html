<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>muxpad</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="muxpad" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#1e1e2e" />
    <!-- No <link> to fonts.googleapis.com. It was render-blocking on EVERY
         load (cross-origin DNS + TLS to the public internet before first
         paint, ~128ms wired and far worse on cellular) to fetch four families
         that are only ever used if the user picks one as their TERMINAL font.
         They are self-hosted now — see web/src/fonts.css — so they cost zero
         bytes until selected. -->
  </head>
  <body>
    <div id="root"></div>
    <!-- THE FIRST REQUEST, FIRED BEFORE THE BUNDLE HAS PARSED.
         The sidebar's first two lists used to be a staircase that could not
         start until React had mounted: measured cold at 4x CPU throttle, the
         app's first request left at 227ms and the second had to wait for the
         first to name a workspace id. This asks for both at ~10ms, in one
         request, overlapped with the download.
         Everything about it is optional: a failure, a 404 from an older
         server, or a path with no workspace in it all leave the app on exactly
         the path it took before. See web/src/boot-prefetch.ts. -->
    <script>
      try {
        var m = location.pathname.match(/^\/w\/([^/]+)/);
        window.__muxpadBoot = fetch('/api/boot' + (m ? '?w=' + encodeURIComponent(m[1]) : ''), {
          headers: { accept: 'application/json' },
        })
          .then(function (r) { return r.ok ? r.json() : null; })
          .catch(function () { return null; });
      } catch (e) {
        /* an optimisation that throws is not an optimisation */
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
