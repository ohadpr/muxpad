<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- NO `viewport-fit=cover`, and this is the second half of the iOS 26
         fix. `cover` lays the page out EDGE TO EDGE, under the status bar and
         the home indicator, whatever the status-bar style says — which is why
         removing `apple-mobile-web-app-status-bar-style` alone did not stop
         the Liquid Glass blur: the page was still underneath the bar for iOS
         to draw its material over. Reported three times from a real phone,
         each time after a clean re-install.
         Without `cover` the web view is inset by the system, the page starts
         below an opaque status bar, and there is no content under it to
         frost. The safe-area insets then report 0, which is correct — there
         is nothing to inset around — and `.app-layout`'s border-box padding
         collapses to nothing. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>muxpad</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="muxpad" />
    <!-- NO `apple-mobile-web-app-status-bar-style`, deliberately.
         `black-translucent` ran the page under the status bar, and on iOS 26
         it also earns a SYSTEM-drawn Liquid Glass blur about 40pt deep over
         the top of the page that no CSS can turn off — reported from a real
         phone as a frosted header with the rows bleeding through it. The
         default style starts the page below an OPAQUE status bar tinted by
         `theme-color` below.
         iOS reads this when the app is ADDED to the home screen, so an
         existing install keeps the blur until it is removed and re-added. -->
    <meta name="theme-color" content="#1e1e2e" />
    <!-- No <link> to fonts.googleapis.com. It was render-blocking on EVERY
         load (cross-origin DNS + TLS to the public internet before first
         paint, ~128ms wired and far worse on cellular) to fetch four families
         that are only ever used if the user picks one as their TERMINAL font.
         They are self-hosted now — see web/src/fonts.css — so they cost zero
         bytes until selected. -->
  </head>
  <body>
    <div id="root"></div>
    <!-- THE FIRST REQUEST, FIRED BEFORE THE BUNDLE HAS PARSED.
         The sidebar's first two lists used to be a staircase that could not
         start until React had mounted: measured cold at 4x CPU throttle, the
         app's first request left at 227ms and the second had to wait for the
         first to name a workspace id. This asks for both at ~10ms, in one
         request, overlapped with the download.
         Everything about it is optional: a failure, a 404 from an older
         server, or a path with no workspace in it all leave the app on exactly
         the path it took before. See web/src/boot-prefetch.ts. -->
    <script>
      try {
        var m = location.pathname.match(/^\/w\/([^/]+)/);
        // DECODED FIRST: `location.pathname` is already percent-encoded, so
        // encoding it again sends `my%2520work` for a slug called `my work`.
        var slug = m ? decodeURIComponent(m[1]) : '';
        window.__muxpadBootAt = performance.now();
        window.__muxpadBoot = fetch('/api/boot' + (slug ? '?w=' + encodeURIComponent(slug) : ''), {
          headers: { accept: 'application/json' },
        })
          .then(function (r) { return r.ok ? r.json() : null; })
          .catch(function () { return null; });
      } catch (e) {
        /* an optimisation that throws is not an optimisation */
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
