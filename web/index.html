    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>muxpad</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="muxpad" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#1e1e2e" />
    <!-- No <link> to fonts.googleapis.com. It was render-blocking on EVERY
         load (cross-origin DNS + TLS to the public internet before first
         paint, ~128ms wired and far worse on cellular) to fetch four families
         that are only ever used if the user picks one as their TERMINAL font.
         They are self-hosted now — see web/src/fonts.css — so they cost zero
         bytes until selected. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
